# Provider configuration
# type: openai-compatible | google | deepl | libretranslate

# --- OpenAI-compatible (default) ---
[provider]
type = "openai-compatible"
api_key_env = "OPENAI_API_KEY"
timeout = 30

[provider.openai]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"

# --- Google Cloud Translation ---
# [provider]
# type = "google"
# api_key_env = "GOOGLE_TRANSLATE_API_KEY"
# timeout = 30

# --- LibreTranslate (self-hosted) ---
# [provider]
# type = "libretranslate"
# timeout = 30
#
# [provider.libretranslate]
# base_url = "http://localhost:5000"
# api_key_env = "LIBRETRANSLATE_API_KEY"   # optional

# --- DeepL ---
# Free plan:  api-free.deepl.com
# Pro plan:   api.deepl.com
# [provider]
# type = "deepl"
# api_key_env = "DEEPL_API_KEY"
# timeout = 30
#
# [provider.deepl]
# base_url = "https://api-free.deepl.com"  # or https://api.deepl.com for Pro

[translation]
source_lang = "auto"
target_lang = "zh"

# --- OCR configuration ---
# [ocr]
# provider = "baidu"
# model = "general_basic"       # or "accurate_basic" for high precision
# language_type = "CHN_ENG"
# timeout = 30
#
# [ocr.baidu]
# base_url = "https://aip.baidubce.com"
# api_key_env = "BAIDU_OCR_API_KEY"
# secret_key_env = "BAIDU_OCR_SECRET_KEY"

# --- TUI Appearance ---
# Colors are ANSI palette numbers ("229") or hex ("#rrggbb"); "" = terminal
# default. Omitting a section or field keeps the default look.
[appearance]
# Don't paint the TUI's own background colors; let the terminal background
# show through. Foregrounds, borders and the selection highlight are kept.
transparent_background = false

[appearance.header]
# The one-line title row at the top of the window.
enabled = true
title = "trans-tui"
show_record_count = true
foreground = "229"
background = ""
bold = true
padding_left = 1
padding_right = 1

[appearance.status_bar]
# The one-line info row at the bottom of the window.
enabled = true
show_record_count = true
show_scroll_position = true
show_input_hint = true
show_quit_hint = true
show_cancel_hint = true
foreground = "241"
background = "235"
padding_left = 1
padding_right = 1

[appearance.record]
# Translation cards in the history list.
border_foreground = "62"
background = ""

[appearance.source]
foreground = "241"
bold = true

[appearance.translation]
foreground = "86"

[appearance.error]
# Error text inside a translation card.
foreground = "196"
bold = true

[appearance.error_panel]
# The bordered warning panel below the history list.
border_foreground = "196"
foreground = "196"
background = ""

[appearance.loading]
foreground = "205"
bold = true
text = "Translating..."

[appearance.input]
# The bordered text input panel.
border_foreground = "62"
background = ""
prompt_foreground = "86"
prompt_bold = true

[appearance.selection]
# Highlight applied to mouse-selected history text.
background = "240"
foreground = "15"

# --- TUI Key Bindings ---
# Every action needs at least one key; an empty list is a config error.
# Keys are Bubble Tea key names: "q", "esc", "enter", "up", "pgdown",
# "ctrl+c", "ctrl+shift+c", ... Overlapping keys across actions are allowed;
# the TUI resolves them in a fixed order (dismiss error > quit > manual
# input > scrolling > navigation > retry; in input mode copy > cancel >
# submit > typing). Omitted actions keep their defaults.
[keybindings]
quit = ["q", "ctrl+c", "esc"]
manual_input = [",", "，"]
scroll_up = ["up", "k"]
scroll_down = ["down", "j"]
page_up = ["pgup", "b"]
page_down = ["pgdown", "f"]
goto_top = ["home", "g"]
goto_bottom = ["end", "G"]
previous_record = ["h"]
next_record = ["l"]
retry = ["r"]
dismiss_error = ["esc"]
cancel_input = ["esc"]
submit_input = ["enter"]
copy_selection = ["ctrl+shift+c"]
