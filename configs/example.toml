# Provider configuration
# type: openai-compatible | google | libretranslate

# --- OpenAI-compatible (default) ---
[provider]
type = "openai-compatible"
api_key_env = "OPENAI_API_KEY"
timeout = 30

[provider.openai]
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"

# --- Google Cloud Translation ---
# [provider]
# type = "google"
# api_key_env = "GOOGLE_TRANSLATE_API_KEY"
# timeout = 30

# --- LibreTranslate (self-hosted) ---
# [provider]
# type = "libretranslate"
# timeout = 30
#
# [provider.libretranslate]
# base_url = "http://localhost:5000"
# api_key_env = "LIBRETRANSLATE_API_KEY"   # optional

# --- DeepL ---
# Free plan:  api-free.deepl.com
# Pro plan:   api.deepl.com
# [provider]
# type = "deepl"
# api_key_env = "DEEPL_API_KEY"
# timeout = 30
#
# [provider.deepl]
# base_url = "https://api-free.deepl.com"  # or https://api.deepl.com for Pro

[translation]
source_lang = "auto"
target_lang = "zh"
